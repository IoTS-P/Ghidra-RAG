services:
  ghidra-rag:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../docs:/app/docs:ro
    environment:
      - GHIDRA_RAG_DATA_DIR=/app/data
      - GHIDRA_RAG_DB_PATH=/app/data/ghidra_rag.db
      - GHIDRA_RAG_VEC_DB_PATH=/app/data/ghidra_vec.db
    restart: unless-stopped
